name: CI and production delivery

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd apps/server
          go mod download

      - name: Check generated contracts
        run: make spec-check

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  publish_images:
    name: Publish commit images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.images.outputs.web }}
      server_image: ${{ steps.images.outputs.server }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve lowercase image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web=ghcr.io/${owner}/littleag-resume-web" >>"${GITHUB_OUTPUT}"
          echo "server=ghcr.io/${owner}/littleag-resume-server" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push server image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.server }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy_production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish_images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      WEB_IMAGE: ${{ needs.publish_images.outputs.web_image }}
      SERVER_IMAGE: ${{ needs.publish_images.outputs.server_image }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/production"
          chmod 600 "${HOME}/.ssh/production"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          ssh_args=(
            -i "${HOME}/.ssh/production"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          scp_args=(
            -i "${HOME}/.ssh/production"
            -P "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${ssh_args[@]}" "${target}" \
            "mkdir -p '${DEPLOY_PATH}/deploy' '${DEPLOY_PATH}/scripts'"
          scp "${scp_args[@]}" deploy/docker-compose.yml \
            "${target}:${DEPLOY_PATH}/deploy/docker-compose.yml"
          scp "${scp_args[@]}" scripts/deploy-production.sh scripts/backup-production.sh \
            "${target}:${DEPLOY_PATH}/scripts/"

      - name: Deploy fixed commit SHA
        shell: bash
        run: |
          ssh_args=(
            -i "${HOME}/.ssh/production"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh "${ssh_args[@]}" "${target}" \
            "cd '${DEPLOY_PATH}' && chmod 700 scripts/*.sh && scripts/deploy-production.sh '${GITHUB_SHA}' '${WEB_IMAGE}' '${SERVER_IMAGE}'"
