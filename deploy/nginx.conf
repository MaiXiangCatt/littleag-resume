server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PDF.js Worker is emitted by Vite as an ES module. Some Nginx MIME maps do
    # not recognize .mjs and fall back to application/octet-stream, which
    # browsers reject for module scripts.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA 路由（含 /print/resumes/...）刷新时回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
