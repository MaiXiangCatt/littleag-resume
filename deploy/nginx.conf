server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HTML must be revalidated so a normal refresh discovers the latest hashed
    # entry files. version.json is polled by already-open tabs for the same reason.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite content-hashed assets are immutable. Missing chunks must remain 404
    # instead of falling through to the SPA HTML document.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # PDF.js Worker is emitted by Vite as an ES module. Some Nginx MIME maps do
    # not recognize .mjs and fall back to application/octet-stream, which
    # browsers reject for module scripts.
    location ~* \.mjs$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA 路由（含 /print/resumes/...）刷新时回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
